# Companies to watch.
#
# Each entry needs a name, the ATS (hiring system) behind its careers page,
# and the identifier that ATS uses for the company:
#
#   greenhouse: slug from boards.greenhouse.io/<slug> or job-boards.greenhouse.io/<slug>
#   lever:      slug from jobs.lever.co/<slug>
#   ashby:      slug from jobs.ashbyhq.com/<slug>
#   workday:    host + site from https://<host>/<site>  (e.g. dell.wd1.myworkdayjobs.com/External)
#
# Not sure a slug is right? Run `python job_alert.py --check` and the script
# reports which boards respond. Boards that fail are skipped, never fatal.
# To add a company, open its careers page, click any job, and read the slug from the URL.

companies:
  # --- Big-company targets (Workday) ---
  - name: Intel
    ats: workday
    host: intel.wd1.myworkdayjobs.com
    site: External
  - name: General Motors
    ats: workday
    host: generalmotors.wd5.myworkdayjobs.com
    site: Careers_GM
  - name: Charles Schwab
    ats: workday
    host: schwab.wd1.myworkdayjobs.com
    site: External

