# Companies to watch. Each entry needs a name, the ATS behind its careers page,
# and the company's identifier in that ATS:
#   greenhouse: slug from job-boards.greenhouse.io/<slug>
#   lever:      slug from jobs.lever.co/<slug>
#   ashby:      slug from jobs.ashbyhq.com/<slug>
#   workday:    host + site from https://<host>/<site>
# Not supported (use the company's own email job alerts): Dell (Oracle),
# Schwab (iCIMS), Nestlé (SuccessFactors), IBM.

